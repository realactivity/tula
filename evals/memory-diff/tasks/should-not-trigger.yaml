id: should-not-trigger-001
name: Should Not Trigger - News prompt routes to myhealth-pulse
description: |
  News question is myhealth-pulse territory. Must NOT emit memory-diff digest.
tags:
  - routing-negative
  - anti-trigger
  - negative-test
  - routing
inputs:
  prompt: |
    What's new in the world of HealthcareAI today?
expected:
  output_not_contains:
    - "Powered by memory-diff"
    - "Tier 1 - Signal"
    - "Tier 2 - Notable"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: routes_to_myhealth_pulse
    config:
      regex_match:
        - "(?i)(myhealth-pulse|news|feeds|not memory-diff|wrong skill)"
