id: positive-category-b-citation-language-001
name: Category B - citation required and discuss-with-doctor framing
description: |
  Skill should propose pre-visit labs to discuss with clinician, include a
  named guideline citation, and avoid imperative ordering language.
tags:
  - positive-trigger
  - lab-analyzer
  - category-b
  - citation
inputs:
  prompt: |
    I started a statin about 6 weeks ago and have cardiology next week.
    Should I ask for any labs before the visit?
expected:
  outcomes:
    - type: task_completed
  output_not_contains:
    - "get this test now"
    - "you should order"
graders:
  - type: text
    name: includes_guideline_citation
    config:
      regex_match:
        - "(?i)(AHA|ACC|USPSTF|ADA)"
        - "(?i)(guideline|recommend)"
        - "(?i)(2018|20[0-9][0-9])"
  - type: text
    name: uses_discuss_with_doctor_posture
    config:
      regex_match:
        - "(?i)(ask your doctor|discuss with your doctor|whether.*order)"
