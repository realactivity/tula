id: edge-case-001
name: Edge Case - Multiple unrelated topics
description: |
  Patient bundles three unrelated questions. Skill should propose separate
  messages, not one bundled draft.
tags:
  - routing-positive
  - edge-case
  - multi-topic
inputs:
  prompt: |
    Can you help me write to Dr. Dave Matthews? I need a refill on my metformin, I
    have questions about my recent A1c result, and I also have a new rash on
    my forearm that's been there for four days.
expected:
  output_contains:
    - "separate"
  output_not_contains:
    - "metformin refill, A1c, and rash"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: proposes_split
    config:
      regex_match:
        - "(?i)(separate|split|which (one|topic)|send first|one at a time)"
