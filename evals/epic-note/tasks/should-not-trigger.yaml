id: should-not-trigger-001
name: Should Not Trigger - General medical question
description: |
  General education question with no portal message intent. Skill must NOT
  produce Subject/greeting/signoff portal format.
tags:
  - routing-negative
  - anti-trigger
  - negative-test
inputs:
  prompt: "What is hypertension and why does it matter?"
expected:
  output_not_contains:
    - "Subject:"
    - "Hello Dr."
    - "Thank you,"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: educational_not_portal
    config:
      regex_match:
        - "(?i)(blood pressure|hypertension|heart|cardiovascular|health)"
