name: epic-note-eval
description: |
  Evaluation suite for epic-note. Portal message drafting, triage, routing,
  adversarial resistance, and golden deterministic output.
skill: epic-note
version: "1.1"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.85
    description: Did the skill produce the correct outcome for this task?
graders:
  - type: code
    name: not_empty
    config:
      assertions:
        - "len(output.strip()) > 0"
  - type: code
    name: under_word_budget
    config:
      assertions:
        - "len(output.split()) < 400"
tasks:
  - "tasks/*.yaml"
  - "tasks/golden/*.yaml"
