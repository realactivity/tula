id: redirect-to-epic-note-001
name: Authoring request should redirect, not parse
description: |
  User asks to draft a portal message. med-pdf should defer to epic-note.
tags:
  - routing-negative
  - negative-trigger
  - skill-routing
inputs:
  prompt: |
    Can you write a quick MyChart message to Dr. Dave Matthews saying I started
    feeling a cough after the lisinopril? Don't use the lab PDF, just
    draft a message.
expected:
  output_not_contains:
    - "extract.mjs"
    - "parse_labs"
    - "parse_imaging"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: mentions_epic_note_or_draft
    config:
      regex_match:
        - "(?i)(epic-note|portal message|draft|MyChart message|message to)"
