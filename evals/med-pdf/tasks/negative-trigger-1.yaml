id: negative-trigger-001
name: Non-medical PDF should not trigger
description: |
  User sends insurance EOB. Skill must NOT invoke med-pdf parsing workflow.
tags:
  - routing-negative
  - negative-trigger
  - anti-trigger
inputs:
  prompt: |
    Here's the EOB from my insurance for last month's visit. Can you tell me
    if I owe anything?
expected:
  output_not_contains:
    - "extract.mjs"
    - "parse_labs"
    - "parse_imaging"
    - ".med-pdf-cache"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: declines_insurance_parsing
    config:
      regex_match:
        - "(?i)(insurance|EOB|billing|not (a )?medical|don't use med-pdf|cannot parse)"
