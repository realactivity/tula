id: positive-trigger-002
name: MyChart imaging PDF (image-only)
description: |
  User shares image-only MyChart export. Skill should recognize OCR/extract path.
tags:
  - routing-positive
  - positive-trigger
  - imaging
  - image-only
inputs:
  prompt: |
    Here's the CT chest report I got from MyChart. The PDF looks weird -
    when I tried to copy text it didn't work. Can you read it and tell me
    what the impression says?
expected:
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: recognizes_image_only
    config:
      regex_match:
        - "(?i)(image|ocr|transcribe|extract|render|outlined|MyChart|imaging|pageN\\.png|hasText)"
