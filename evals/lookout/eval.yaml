name: lookout-eval
description: |
  Evaluation suite for the lookout skill. Verifies the agent triages
  ambient/place/SDoH data against the patient's record (no hallucinated
  values, no diagnosis or treatment, relevance over completeness,
  health-data only / no billing), and that "lookout for me" produces a
  patient-tailored briefing instead of a generic weather summary.
skill: lookout
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Did the skill respond correctly to triggers and boundary conditions?
graders:
  - type: code
    name: not_empty
    config:
      assertions:
        - "len(output.strip()) > 0"
tasks:
  - "tasks/*.yaml"
