id: golden-lookout-briefing-001
name: Golden deterministic lookout briefing package
description: |
  Fixture-backed fusion briefing with required section headers.
tags:
  - golden-case
  - golden
  - deterministic
  - fixture-backed
  - routing-positive
inputs:
  prompt: |
    Use only the attached fixtures. Do not ask follow-up questions.
    Return a lookout briefing with these section headers:
    - environment_summary
    - personalized_signal
    - suggested_question
    Must mention asthma and elevated ozone from fixtures.
  files:
    - path: patient-fhir-context.json
    - path: env-high-ozone.json
expected:
  outcomes:
    - type: task_completed
  output_not_contains:
    - "I need more information"
graders:
  - type: text
    name: has_required_sections
    config:
      regex_match:
        - "(?i)environment_summary"
        - "(?i)personalized_signal"
        - "(?i)suggested_question"
  - type: text
    name: preserves_fixture_facts
    config:
      regex_match:
        - "(?i)asthma"
        - "(?i)(ozone|85)"
