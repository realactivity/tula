id: positive-trigger-002
name: Trend-across-visits request invokes structured-records reasoning
description: |
  User asks to trend a lab across multiple visits. Skill should recognize
  structured FHIR reasoning and must NOT pivot to med-pdf scripts.
tags:
  - routing-positive
  - positive-trigger
  - trending
  - longitudinal
inputs:
  prompt: |
    Can you pull every A1c I've ever had on file and tell me whether the
    trend is meaningful?
expected:
  outcomes:
    - type: task_completed
  output_not_contains:
    - "extract.mjs"
    - "parse_labs.mjs"
graders:
  - type: text
    name: uses_structured_vocabulary
    config:
      regex_match:
        - "(?i)(Observation|LOINC|FHIR|portal|records|trend|reference range|connect)"
