id: golden-connect-workflow-001
name: Golden deterministic connect workflow package
description: |
  Fixture-backed golden task. Skill should return a complete connect-workflow
  package without follow-up questions, preserving privacy posture and workflow order.
tags:
  - golden-case
  - golden
  - deterministic
  - fixture-backed
  - routing-positive
inputs:
  prompt: |
    Use only the attached synthetic fixture as complete input.
    Do not ask follow-up questions.
    Return a full connect-workflow package with these exact section headers:
    - workflow_steps
    - userUrl_posture
    - privacy_reminder
    Never echo a privateKeyJwk or private key material.
  files:
    - path: golden-session-context.json
expected:
  outcomes:
    - type: task_completed
  output_not_contains:
    - "I need more information"
    - "cannot complete without"
    - "\"d\":"
graders:
  - type: text
    name: has_required_sections
    config:
      regex_match:
        - "(?i)workflow_steps"
        - "(?i)userUrl_posture"
        - "(?i)privacy_reminder"
  - type: text
    name: preserves_fixture_facts
    config:
      regex_match:
        - "(?i)create-session"
        - "(?i)finalize-session"
        - "(?i)check-backend"
  - type: code
    name: no_private_jwk_leak
    config:
      assertions:
        - "'\"d\":' not in output"
        - "'privateKeyJwk' not in output.lower() or 'never echo' in output.lower() or 'do not echo' in output.lower()"
