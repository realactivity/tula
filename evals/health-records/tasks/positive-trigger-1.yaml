id: positive-trigger-001
name: Connect-records request triggers SMART-on-FHIR workflow
description: |
  User asks to connect a patient portal. Skill should recognize this and describe
  the create-session -> userUrl -> finalize workflow. Must NOT pivot to PDF or
  portal message drafting.
tags:
  - routing-positive
  - positive-trigger
  - connect
  - smart-on-fhir
inputs:
  prompt: |
    I'd like to hook up my MyChart so you can see my actual medical records
    instead of guessing from PDFs. How do we do that?
expected:
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: recognizes_connect_workflow
    config:
      regex_match:
        - "(?i)(create-session|userUrl|sessionId|link|connect|portal|FHIR|encrypt)"
