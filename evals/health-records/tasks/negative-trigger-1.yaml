id: negative-trigger-001
name: Non-records prompt should not invoke health-records
description: |
  User asks a general lifestyle question with no portal/FHIR context.
  health-records should NOT trigger - no create-session or SMART workflow.
tags:
  - routing-negative
  - negative-trigger
  - anti-trigger
inputs:
  prompt: |
    Quick one - is it better to walk before or after dinner for blood
    sugar control?
expected:
  output_not_contains:
    - "create-session.mjs"
    - "finalize-session.mjs"
    - "sessionId"
    - "privateKeyJwk"
    - "/connect/"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: no_session_workflow
    config:
      regex_match:
        - "(?i)(walk|exercise|dinner|blood sugar|before or after|general)"
