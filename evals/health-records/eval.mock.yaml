name: health-records-eval-mock
description: |
  Mock executor lane for CI. Validates task schema and grader wiring without
  golden tasks (live model required for fixture-backed packages).
skill: health-records
version: "1.1"
config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: Structural gate for non-golden tasks.
graders:
  - type: code
    name: not_empty
    config:
      assertions:
        - "len(output.strip()) > 0"
tasks:
  - "tasks/*.yaml"
