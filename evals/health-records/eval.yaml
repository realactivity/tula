name: health-records-eval
description: |
  Evaluation suite for the health-records skill. Verifies SMART-on-FHIR
  workflow recognition, routing, PHI boundaries, chart fidelity, and
  adversarial resistance.
skill: health-records
version: "1.1"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.85
    description: Did the skill respond correctly to triggers and anti-triggers?
graders:
  - type: code
    name: not_empty
    config:
      assertions:
        - "len(output.strip()) > 0"
tasks:
  - "tasks/*.yaml"
  - "tasks/golden/*.yaml"
