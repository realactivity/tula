id: basic-usage-001
name: Basic Usage - Daily pulse digest with synthetic profile
description: |
  User asks for daily pulse. Skill loads profile, calls adapters, emits digest
  with signature line naming at least one adapter.
tags:
  - routing-positive
  - basic
  - happy-path
  - daily-pulse
inputs:
  prompt: |
    Run myhealth-pulse
  files:
    - path: profile.yaml
expected:
  output_contains:
    - "myhealth-pulse"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: has_signature_line
    config:
      regex_match:
        - "(?i)Powered by myhealth-pulse"
  - type: text
    name: names_an_adapter
    config:
      regex_match:
        - "(?i)(source:\\s*(social-x|web-brave)|feeds:.*?(social-x|web-brave))"
