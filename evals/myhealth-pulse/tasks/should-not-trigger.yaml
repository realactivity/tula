id: should-not-trigger-001
name: Should Not Trigger - PDF prompt routes to med-pdf
description: |
  User shares medical PDF. Skill must NOT emit pulse digest; route to med-pdf.
tags:
  - routing-negative
  - anti-trigger
  - negative-test
  - routing
inputs:
  prompt: |
    I just downloaded my lab results PDF - can you take a look?
expected:
  output_not_contains:
    - "Powered by myhealth-pulse"
    - "source: social-x"
    - "source: web-brave"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: routes_to_med_pdf
    config:
      regex_match:
        - "(?i)(med-pdf|PDF|extract|parse|not myhealth-pulse|wrong skill)"
