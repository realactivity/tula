id: mention-alert-001
name: Mention Alert - Search for handle mentions
description: |
  User asks about mentions. Skill runs mention query and emits digest shape.
tags:
  - routing-positive
  - mention
  - happy-path
inputs:
  prompt: |
    Any mentions of me in clinical AI discussions today?
  files:
    - path: profile.yaml
expected:
  output_contains:
    - "myhealth-pulse"
  outcomes:
    - type: task_completed
graders:
  - type: text
    name: has_signature_line
    config:
      regex_match:
        - "(?i)Powered by myhealth-pulse"
